<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Neo Soft</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1409">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neo Soft">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f5f0e8;
  --surface:  #fffdf8;
  --surface2: #f0ebe0;
  --border:   #e2d9c8;
  --border2:  #d4c9b4;
  --ink:      #1c1409;
  --ink2:     #3d2e1a;
  --ink3:     #6b5030;
  --muted:    #9a7e5a;
  --muted2:   #c4a882;
  --gold:     #b8791a;
  --gold2:    #d4921f;
  --gold3:    #f0b840;
  --goldbg:   #fef7e4;
  --goldbdr:  #f0d080;
  --green:    #1e6b45;
  --greenbg:  #e8f5ee;
  --greenbdr: #90d4a8;
  --red:      #8b1a1a;
  --redbg:    #fdf0f0;
  --redbdr:   #f0a0a0;
  --blue:     #1a4a8b;
  --bluebg:   #eef3fd;
  --bluebdr:  #90b4f0;
  --sh1: 0 1px 4px rgba(28,20,9,.06);
  --sh2: 0 4px 20px rgba(28,20,9,.10);
  --sh3: 0 8px 40px rgba(28,20,9,.16);
  --sh4: 0 20px 60px rgba(28,20,9,.22);
  --r:  12px;
  --r2: 18px;
  --r3: 24px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Vazirmatn',Tahoma,sans-serif;direction:rtl;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ─── LAYOUT ────────────────────────────────────── */
#app{display:flex;min-height:100vh}

/* sidebar */
#sidebar{
  width:240px;min-width:240px;background:var(--ink);
  display:flex;flex-direction:column;
  position:fixed;top:0;right:0;bottom:0;z-index:300;
  transition:transform .28s ease;
}
#sidebar-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:299;
}
.sb-logo{
  padding:24px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.sb-gem{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(135deg,var(--gold3),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
  box-shadow:0 3px 12px rgba(184,121,26,.5);
}
.sb-name{font-size:15px;font-weight:900;color:#fef3c7;letter-spacing:-.2px}
.sb-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
#sidebar nav{flex:1;padding:12px 10px;overflow-y:auto}
.nl{font-size:9px;font-weight:700;color:rgba(255,255,255,.2);letter-spacing:1.2px;padding:14px 10px 5px;text-transform:uppercase}
.ni{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r);border:none;
  background:none;font-family:inherit;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.45);cursor:pointer;text-align:right;
  margin-bottom:2px;transition:all .15s;white-space:nowrap;
  position:relative;
}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.ni.on{background:rgba(184,121,26,.25);color:var(--gold3);font-weight:700;border:1px solid rgba(184,121,26,.22)}
.ni.on::after{content:'';position:absolute;right:0;top:25%;bottom:25%;width:3px;background:var(--gold3);border-radius:2px 0 0 2px}
.ni-ic{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:background .15s}
.ni.on .ni-ic{background:rgba(184,121,26,.28)}
.ni-badge{margin-right:auto;background:#c1121f;color:#fff;font-size:9px;font-weight:800;min-width:17px;height:17px;padding:0 4px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.sb-foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.2);line-height:1.8;text-align:center}

/* main */
#main{margin-right:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{
  display:none;background:var(--ink);
  padding:13px 16px;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
#topbar-title{font-size:15px;font-weight:900;color:var(--gold3)}
.ham-btn{background:none;border:none;color:rgba(255,255,255,.5);font-size:22px;cursor:pointer;padding:4px 6px;border-radius:6px;line-height:1}
.ham-btn:hover{color:var(--gold3)}
#content{padding:32px 36px;flex:1}

/* ─── COMPONENTS ─────────────────────────────────── */
/* page header */
.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.ph-info{flex:1;min-width:0}
.ph-eye{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ph-title{font-size:26px;font-weight:900;color:var(--ink);letter-spacing:-.4px}
.ph-sub{font-size:12px;color:var(--muted);margin-top:3px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:var(--r);border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .16s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink2);color:var(--gold3);box-shadow:var(--sh1)}
.btn-dark:hover{background:var(--ink);box-shadow:var(--sh2);transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold3),var(--gold2));color:var(--ink);box-shadow:0 3px 14px rgba(184,121,26,.3)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);color:var(--ink3);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--surface2);border-color:var(--border2)}
.btn-red{background:var(--redbg);color:var(--red);border:1.5px solid var(--redbdr)}
.btn-red:hover{background:#fce4e4}
.btn-green{background:var(--greenbg);color:var(--green);border:1.5px solid var(--greenbdr)}
.btn-green:hover{background:#d4eedd}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:9px;gap:5px}
.btn-ico{padding:7px;border-radius:8px}

/* cards */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:22px;box-shadow:var(--sh1)}
.card-flat{box-shadow:none}

/* stat cards */
.stats{display:grid;gap:14px;margin-bottom:28px}
.stats-4{grid-template-columns:repeat(4,1fr)}
.stats-3{grid-template-columns:repeat(3,1fr)}
.stats-2{grid-template-columns:repeat(2,1fr)}
.stat{border-radius:var(--r2);padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;border:1.5px solid transparent}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.stat-amber{background:linear-gradient(145deg,#fffbe8,#fef3c0);border-color:var(--goldbdr)}
.stat-green{background:linear-gradient(145deg,#edfdf5,#d4f5e4);border-color:var(--greenbdr)}
.stat-blue{background:linear-gradient(145deg,#eff5ff,#ddeaff);border-color:var(--bluebdr)}
.stat-rose{background:linear-gradient(145deg,#fff2f2,#ffe4e4);border-color:var(--redbdr)}
.stat-ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;box-shadow:var(--sh1)}
.stat-amber .stat-ic{background:linear-gradient(135deg,#fde68a,#f59e0b)}
.stat-green .stat-ic{background:linear-gradient(135deg,#6ee7b7,#10b981)}
.stat-blue  .stat-ic{background:linear-gradient(135deg,#93c5fd,#3b82f6)}
.stat-rose  .stat-ic{background:linear-gradient(135deg,#fda4af,#f43f5e)}
.stat-lbl{font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:5px}
.stat-val{font-size:26px;font-weight:900;color:var(--ink);letter-spacing:-.6px;line-height:1}
.stat-val.sm{font-size:17px;letter-spacing:-.3px}
.stat-hint{font-size:11px;color:var(--muted);margin-top:6px}

/* section title */
.st{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}

/* badge */
.bdg{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:700}
.bdg-amber{background:var(--goldbg);color:#7c4a00;border:1px solid var(--goldbdr)}
.bdg-green{background:var(--greenbg);color:#0f4a2a;border:1px solid var(--greenbdr)}
.bdg-red  {background:var(--redbg);color:var(--red);border:1px solid var(--redbdr)}
.bdg-blue {background:var(--bluebg);color:var(--blue);border:1px solid var(--bluebdr)}

/* alert */
.alert{display:flex;align-items:flex-start;gap:10px;padding:13px 16px;border-radius:var(--r);font-size:13px;line-height:1.6;margin-bottom:16px}
.al-amber{background:var(--goldbg);border:1.5px solid var(--goldbdr);color:#5a3200}
.al-green{background:var(--greenbg);border:1.5px solid var(--greenbdr);color:#0f4a2a}
.al-red  {background:var(--redbg);border:1.5px solid var(--redbdr);color:var(--red)}
.al-blue {background:var(--bluebg);border:1.5px solid var(--bluebdr);color:var(--blue)}

/* tabs */
.tabs{display:flex;gap:3px;background:var(--surface2);padding:4px;border-radius:10px;width:fit-content;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:7px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s}
.tab.on{background:var(--surface);color:var(--ink2);box-shadow:var(--sh1)}

/* search */
.search-wrap{position:relative;margin-bottom:20px}
.search-ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.4;pointer-events:none}
.search{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:11px 42px 11px 14px;font-size:13px;font-weight:500;color:var(--ink);font-family:inherit;direction:rtl;transition:border-color .15s,box-shadow .15s}
.search:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(184,121,26,.12)}
.search::placeholder{color:var(--muted2)}

/* form grid */
.fg{display:grid;gap:14px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fspan{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:10px 13px;font-size:13px;font-weight:500;color:var(--ink);font-family:inherit;direction:rtl;width:100%;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 3px rgba(184,121,26,.1);background:var(--surface)}
.fld input::placeholder{color:var(--muted2)}
.fld textarea{resize:vertical;min-height:74px}

/* customer card */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
.cc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;transition:all .2s;box-shadow:var(--sh1);position:relative;overflow:hidden}
.cc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold2),var(--muted2));opacity:0;transition:opacity .2s}
.cc:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:var(--sh2)}
.cc:hover::before{opacity:1}
.av{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--muted2),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--ink);flex-shrink:0;box-shadow:0 2px 8px rgba(184,121,26,.2)}
.av-lg{width:76px;height:76px;font-size:30px;border-radius:20px}

/* order / expense row */
.oc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:18px 22px;box-shadow:var(--sh1);transition:box-shadow .2s,border-color .2s;margin-bottom:10px}
.oc:hover{box-shadow:var(--sh2);border-color:var(--border2)}
.oid{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--muted);background:var(--surface2);padding:2px 9px;border-radius:4px;border:1px solid var(--border)}

/* inventory card */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ic{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:18px;box-shadow:var(--sh1);transition:all .2s}
.ic:hover{box-shadow:var(--sh2)}
.ic.low{border-color:var(--redbdr);background:#fffafa}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:10px 0 7px}
.prog-fill{height:100%;border-radius:3px;transition:width .6s ease}

/* measurement row */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;border-radius:7px;font-size:12px;background:var(--bg);border:1px solid var(--border)}
.mkey{color:var(--muted)}
.mval{font-weight:800;color:var(--gold)}

/* profile grid */
.pgrid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);border:1.5px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface)}
th{text-align:right;padding:11px 14px;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;border-bottom:2px solid var(--border);background:var(--surface2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--surface2);transition:background .13s}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}

/* hr */
hr{border:none;border-top:1px solid var(--border);margin:20px 0}

/* modal — NO BLUR, simple overlay */
.modal-bg{
  position:fixed;inset:0;z-index:500;
  background:rgba(28,20,9,.6);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  animation:mfade .18s ease;
}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--r3);width:100%;max-width:660px;
  max-height:90vh;overflow-y:auto;
  box-shadow:var(--sh4);
  animation:mslide .22s cubic-bezier(.34,1.4,.64,1);
}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@keyframes mslide{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:var(--r3) var(--r3) 0 0}
.mtitle{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.2px}
.mbody{padding:24px}
.mfoot{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border);background:var(--surface2);border-radius:0 0 var(--r3) var(--r3)}

/* toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fef3c7;
  padding:11px 26px;border-radius:50px;
  font-size:13px;font-weight:600;
  z-index:9999;transition:transform .28s cubic-bezier(.34,1.4,.64,1);
  box-shadow:var(--sh4);white-space:nowrap;pointer-events:none;
  border:1px solid rgba(255,255,255,.08);
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.ok {background:var(--green)}
#toast.err{background:var(--red)}

/* empty */
.empty{text-align:center;padding:56px 20px;color:var(--muted2)}
.empty-ico{font-size:52px;margin-bottom:12px;opacity:.4}
.empty-txt{font-size:14px}

/* sms box */
.sms-preview{background:var(--ink2);color:#f0e0c0;border-radius:var(--r);padding:18px;font-size:14px;line-height:2.1;white-space:pre-wrap;font-family:inherit}

/* utils */
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}
.sp{flex:1}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.fw{width:100%}
.sm{font-size:12px}
.mut{color:var(--muted)}
.bold{font-weight:700}
.black{font-weight:900}
.c-gold{color:var(--gold);font-weight:700}
.c-green{color:var(--green);font-weight:700}
.c-red{color:var(--red);font-weight:700}

/* ─── RESPONSIVE ─────────────────────────────────── */
@media(max-width:860px){
  #sidebar{transform:translateX(100%)}
  #sidebar.open{transform:translateX(0);box-shadow:var(--sh4)}
  #main{margin-right:0}
  #topbar{display:flex}
  #content{padding:16px}
  .stats-4{grid-template-columns:1fr 1fr}
  .stats-3{grid-template-columns:1fr 1fr}
  .fg2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
  .pgrid{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr}
  .igrid{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .stats-4,.stats-3,.stats-2{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr}
  .igrid{grid-template-columns:1fr}
  .modal{max-height:95vh}
  .ph{flex-direction:column;align-items:stretch}
  .ph-actions{justify-content:flex-start}
  .tabs{overflow-x:auto;width:100%;flex-wrap:nowrap}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="sidebar-overlay" onclick="sbClose()"></div>

<div id="app">
  <aside id="sidebar">
    <div class="sb-logo">
      <div class="sb-gem">✂️</div>
      <div>
        <div class="sb-name">Neo Soft</div>
        <div class="sb-sub">سیستم مدیریت خیاطی</div>
      </div>
    </div>
    <nav>
      <div class="nl">اصلی</div>
      <button class="ni on" id="ni-dashboard" onclick="go('dashboard')"><span class="ni-ic">📊</span>داشبورد</button>
      <button class="ni" id="ni-customers" onclick="go('customers')"><span class="ni-ic">👥</span>مشتریان</button>
      <button class="ni" id="ni-orders" onclick="go('orders')"><span class="ni-ic">📋</span>سفارش‌ها<span class="ni-badge" id="ready-badge" style="display:none;background:#1a4a8b">0</span></button>
      <div class="nl">مالی و انبار</div>
      <button class="ni" id="ni-expenses" onclick="go('expenses')"><span class="ni-ic">💸</span>مخارج</button>
      <button class="ni" id="ni-sales" onclick="go('sales')"><span class="ni-ic">💰</span>فروش</button>
      <button class="ni" id="ni-debtors" onclick="go('debtors')"><span class="ni-ic">⏳</span>طلبات مشتریان<span class="ni-badge" id="debt-badge" style="display:none">0</span></button>
      <button class="ni" id="ni-inventory" onclick="go('inventory')"><span class="ni-ic">📦</span>انبار<span class="ni-badge" id="inv-badge" style="display:none">0</span></button>
      <button class="ni" id="ni-fabric-sales" onclick="go('fabric-sales')"><span class="ni-ic">🧶</span>فروش تکه</button>
      <button class="ni" id="ni-reports" onclick="go('reports')"><span class="ni-ic">📈</span>گزارشات</button>
      <div class="nl">سیستم</div>
      <button class="ni" id="ni-settings" onclick="go('settings')"><span class="ni-ic">⚙️</span>تنظیمات</button>
    </nav>
    <div class="sb-foot">داده‌ها روی این دستگاه ذخیره می‌شوند<br>Neo Soft — نسخه ۲.۰</div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button class="ham-btn" onclick="sbOpen()">☰</button>

<script>
'use strict';
/* ══════════════════════════════════════════════
   DATABASE  (IndexedDB — on-device, offline, persistent)
   Same dbAll/dbGet/dbPut/dbDel interface as the desktop build.
══════════════════════════════════════════════ */

const DB_NAME = 'atelye';
const DB_VERSION = 1;
const STORES = ['customers','orders','inventory','expenses','fabric-sales','cfg'];
let _db = null;

function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      for(const s of STORES){
        if(!db.objectStoreNames.contains(s)){
          db.createObjectStore(s, { keyPath: 'id' });
        }
      }
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

function _tx(store, mode){
  return openDB().then(db => db.transaction(store, mode).objectStore(store));
}

async function dbAll(store){
  const os = await _tx(store, 'readonly');
  return new Promise((resolve, reject) => {
    const req = os.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror   = () => reject(req.error);
  });
}

async function dbGet(store, key){
  const os = await _tx(store, 'readonly');
  return new Promise((resolve, reject) => {
    const req = os.get(String(key));
    req.onsuccess = () => resolve(req.result || null);
    req.onerror   = () => reject(req.error);
  });
}

async function dbPut(store, item){
  const os = await _tx(store, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = os.put(item);
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  });
}

async function dbDel(store, key){
  const os = await _tx(store, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = os.delete(String(key));
    req.onsuccess = () => resolve();
    req.onerror   = () => reject(req.error);
  });
}

/* ══════════════════════════════════════════════

const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

/* ══════════════════════════════════════════════
   تقویم جلالی (شمسی)
══════════════════════════════════════════════ */
const Jalali={
  _isLeap(y){const r=((y-474)%2820+474+38)*682;return(r%2816)<682;},
  _yearStart(y){
    const ep=474+((y-474)%2820);
    return 365*(y-474)+Math.floor((682*ep-110)/2816)+
           Math.floor((ep-1)*365+365*474)+1948319.5;
  },
  fromGregorian(gy,gm,gd){
    const jd=Math.floor((new Date(gy,gm-1,gd)-new Date(1970,0,1))/(86400000))+2440587.5;
    let jy=jd>=1948438.5?
      Math.floor((jd-1948438.5)/365.25)+1:
      Math.floor((jd-1948438.5)/365.25);
    // simple algorithm
    const days=[0,31,59,90,120,151,181,212,243,273,304,334];
    let g=new Date(gy,gm-1,gd);
    // Use the proven algorithm
    return this._g2j(gy,gm,gd);
  },
  _g2j(gy,gm,gd){
    gy=parseInt(gy);gm=parseInt(gm);gd=parseInt(gd);
    const g_d_no=365*gy+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400);
    let jy=gy-621,i;
    const jdn=g_d_no+Math.floor(365.25*(gy+0.25))-Math.floor((gy+99)/100)+Math.floor((gy+399)/400)+
      [0,31,59,90,120,151,181,212,243,273,304,334][gm-1]+gd;
    // simplified: just use known offset
    const t=new Date(gy,gm-1,gd);
    const ref=new Date(622,2,22); // approximate
    // Use lookup table approach
    return this._convert(gy,gm,gd);
  },
  _convert(gy,gm,gd){
    gy=parseInt(gy);gm=parseInt(gm);gd=parseInt(gd);
    const gdm=[31,28,31,30,31,30,31,31,30,31,30,31];
    const jdm=[31,31,31,31,31,31,30,30,30,30,30,29];
    gy-=1600; gm--; gd--;
    let gDayNo=365*gy+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400);
    for(let i=0;i<gm;i++) gDayNo+=gdm[i];
    if(gm>1&&((gy%4===0&&gy%100!==0)||(gy%400===0))) gDayNo++;
    gDayNo+=gd;
    let jDayNo=gDayNo-79;
    const jNpY=Math.floor(jDayNo/12053); jDayNo%=12053;
    let jy=979+33*jNpY+4*Math.floor(jDayNo/1461);
    jDayNo%=1461;
    if(jDayNo>=366){jy+=Math.floor((jDayNo-1)/365);jDayNo=(jDayNo-1)%365;}
    let jm=0;
    for(let i=0;i<11&&jDayNo>=jdm[i];i++){jDayNo-=jdm[i];jm=i+1;}
    jm++;
    return [jy,jm,jDayNo+1];
  },
  toGregorian(jy,jm,jd){
    jy=parseInt(jy);jm=parseInt(jm);jd=parseInt(jd);
    const j=[0,31,62,93,124,155,185,216,246,276,306,337];
    jy-=979;jm--;jd--;
    let jDayNo=365*jy+Math.floor(jy/4)*8+Math.floor(jy/33)*(-1)+Math.floor(jy/4)*(-1)+j[jm]+jd;
    // simpler
    let a=Math.floor((jy-474)/2820)*1029983;
    let cy=(jy-474)%2820+474;
    let b=Math.floor((682*cy-110)/2816);
    let jd2=a+b+365*(cy-1)+365*(474)+1948319;
    // use offset method
    return this._j2g(parseInt(jy)+979, parseInt(jm)+1, parseInt(jd)+1);
  },
  _j2g(jy,jm,jd){
    const j=[0,31,62,93,124,155,185,216,246,276,306,337];
    jy-=979;jm--;jd--;
    let jDayNo=365*jy+(Math.floor(jy/33)*8+Math.floor((jy%33+3)/4))+j[jm]+jd;
    let gDayNo=jDayNo+79;
    let gy=1600+400*Math.floor(gDayNo/146097);gDayNo%=146097;
    let leap=true;
    if(gDayNo>=36525){gDayNo++;gy+=100*Math.floor(gDayNo/36524);gDayNo%=36524;if(gDayNo>=365)gDayNo++;else leap=false;}
    gy+=4*Math.floor(gDayNo/1461);gDayNo%=1461;
    if(gDayNo>=366){leap=false;gDayNo++;gy+=Math.floor(gDayNo/365);gDayNo=gDayNo%365;}
    const g=[31,29+(leap?1:0),31,30,31,30,31,31,30,31,30,31];
    let gm;
    for(gm=0;gm<12&&gDayNo>=g[gm];gm++)gDayNo-=g[gm];
    return new Date(gy,gm,gDayNo+1);
  },
  monthLen(jy,jm){return jm<=6?31:jm<=11?30:this._isLeap(jy)?30:29;},
  monthName(m){return['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][m-1];},
  dayName(d){return['ش','ی','د','س','چ','پ','ج'][d];}
};

// Today in Jalali
function today(){
  const n=new Date();
  const [jy,jm,jd]=Jalali._convert(n.getFullYear(),n.getMonth()+1,n.getDate());
  return `${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`;
}

// Convert stored Gregorian dates to Jalali (for old data compatibility)
function ensureJalali(dateStr){
  if(!dateStr) return '';
  const d=String(dateStr).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
  // If year > 1500 it's probably Gregorian
  const y=parseInt(d.split('/')[0]);
  if(y>1500){
    const parts=d.split('/');
    const [jy,jm,jd]=Jalali._convert(parseInt(parts[0]),parseInt(parts[1]),parseInt(parts[2]));
    return `${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`;
  }
  return d;
}

/* ──────────────────────────────────────────────
   تقویم popup — date picker شمسی
────────────────────────────────────────────── */
let _dpTarget=null, _dpY=0, _dpM=0;

function openDatePicker(inputId){
  const inp=el(inputId);
  if(!inp) return;
  _dpTarget=inputId;
  // parse current value or use today
  let cur=inp.value.trim().replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
  let cy,cm;
  if(cur && cur.includes('/')){
    const p=cur.split('/');
    cy=parseInt(p[0])||1404; cm=parseInt(p[1])||1;
  } else {
    const t=today().split('/');
    cy=parseInt(t[0]); cm=parseInt(t[1]);
  }
  _dpY=cy; _dpM=cm;
  renderDatePicker();
}

function renderDatePicker(){
  const existing=el('dp-popup');
  if(existing) existing.remove();

  const jy=_dpY, jm=_dpM;
  const firstDay=Jalali._j2g(jy,jm,1).getDay(); // 0=Sun
  // Convert to Sat=0 week start (شنبه اول)
  const startOffset=(firstDay+1)%7; // Sat=0,Sun=1,...,Fri=6
  const daysInMonth=Jalali.monthLen(jy,jm);
  const todayStr=today();

  // build grid
  let cells='';
  let cellNum=0;
  const totalCells=Math.ceil((startOffset+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const day=i-startOffset+1;
    if(day<1||day>daysInMonth){
      cells+=`<div></div>`;
    } else {
      const ds=`${jy}/${String(jm).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
      const isToday=ds===todayStr;
      const inp=el(_dpTarget);
      const cur=inp?inp.value.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776):'';
      const isSel=ds===cur;
      cells+=`<div onclick="dpPickDay(${day})" style="
        width:32px;height:32px;display:flex;align-items:center;justify-content:center;
        border-radius:8px;cursor:pointer;font-size:12px;font-weight:${isToday||isSel?'900':'500'};
        background:${isSel?'var(--gold2)':isToday?'var(--goldbg)':'transparent'};
        color:${isSel?'var(--ink)':isToday?'var(--gold)':'var(--ink)'};
        border:${isToday&&!isSel?'1.5px solid var(--goldbdr)':'none'};
      " onmouseover="this.style.background='${isSel?'var(--gold2)':'var(--surface2)'}';" 
         onmouseout="this.style.background='${isSel?'var(--gold2)':isToday?'var(--goldbg)':'transparent'}';">
        ${toFa(day)}
      </div>`;
    }
  }

  const div=document.createElement('div');
  div.id='dp-popup';
  div.style.cssText=`
    position:fixed;z-index:9000;background:var(--surface);border:1.5px solid var(--border);
    border-radius:var(--r2);box-shadow:var(--sh4);padding:16px;width:280px;
    font-family:inherit;direction:rtl;
  `;

  // Position near input
  const inp=el(_dpTarget);
  if(inp){
    const r=inp.getBoundingClientRect();
    const top=r.bottom+6;
    const right=window.innerWidth-r.right;
    div.style.top=Math.min(top, window.innerHeight-320)+'px';
    div.style.right=Math.max(8,right)+'px';
  } else {
    div.style.top='50%'; div.style.left='50%'; div.style.transform='translate(-50%,-50%)';
  }

  div.innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button onclick="dpNav(1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--gold);padding:4px 8px;">‹</button>
      <div style="font-weight:900;font-size:14px">${toFa(jy)} ${Jalali.monthName(jm)}</div>
      <button onclick="dpNav(-1)" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--gold);padding:4px 8px;">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,32px);gap:2px;justify-content:center;margin-bottom:8px">
      ${['ش','ی','د','س','چ','پ','ج'].map(d=>`<div style="width:32px;text-align:center;font-size:10px;font-weight:800;color:var(--muted)">${d}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,32px);gap:2px;justify-content:center">
      ${cells}
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;justify-content:flex-end">
      <button onclick="dpClear()" style="background:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:inherit;color:var(--muted)">پاک</button>
      <button onclick="dpClose()" style="background:none;border:1px solid var(--border);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:inherit;color:var(--muted)">بستن</button>
    </div>
  `;

  document.body.appendChild(div);
  // close on outside click
  setTimeout(()=>{
    document.addEventListener('mousedown',_dpOutsideHandler);
  },100);
}

function _dpOutsideHandler(e){
  const pp=el('dp-popup');
  if(pp && !pp.contains(e.target)){dpClose();}
}

function dpNav(dir){
  _dpM+=dir;
  if(_dpM>12){_dpM=1;_dpY++;}
  if(_dpM<1){_dpM=12;_dpY--;}
  renderDatePicker();
}

function dpPickDay(day){
  const inp=el(_dpTarget);
  if(inp){
    inp.value=`${_dpY}/${String(_dpM).padStart(2,'0')}/${String(day).padStart(2,'0')}`;
    inp.dispatchEvent(new Event('change',{bubbles:true}));
  }
  dpClose();
}

function dpClear(){
  const inp=el(_dpTarget);
  if(inp){inp.value='';inp.dispatchEvent(new Event('change',{bubbles:true}));}
  dpClose();
}

function dpClose(){
  const pp=el('dp-popup');
  if(pp) pp.remove();
  document.removeEventListener('mousedown',_dpOutsideHandler);
  _dpTarget=null;
}

};

async function go(page,extra){

  const nb=el('ni-'+(page==='profile'?'customers':page));

  switch(page){

    case 'expenses':     return pgExpenses();

async function refreshBadge(){
  try{
    const [inv,ords,fSales]=await Promise.all([dbAll('inventory'),dbAll('orders'),dbAll('fabric-sales')]);
    const low=inv.filter(i=>Number(i.qty)<=Number(i.minQty)).length;
    const b=el('inv-badge');
    if(b){b.style.display=low?'flex':'none';b.textContent=toFa(low);}
    const ready=ords.filter(o=>o.status==='آماده تحویل').length;
    const rb=el('ready-badge');
    if(rb){rb.style.display=ready?'flex':'none';rb.textContent=toFa(ready);}
    const debtSet=new Set();
    ords.forEach(o=>{if(Number(o.price||0)-Number(o.paid||0)>0) debtSet.add(o.custId);});
    (fSales||[]).forEach(s=>{if(Number(s.price||0)-Number(s.paid||0)>0) debtSet.add(s.custId||'_f'+s.id);});
    const db=el('debt-badge');
    if(db){db.style.display=debtSet.size?'flex':'none';db.textContent=toFa(debtSet.size);}
  }catch(e){}
}

  if(q!==undefined) custSearch=q;
  let custs=await dbAll('customers');
  const allOrds=await dbAll('orders');
  if(custSearch) custs=custs.filter(c=>c.name.includes(custSearch)||(c.phone||'').includes(custSearch));
  custs.sort((a,b)=>b.ts-a.ts);

  setContent(`
    <div class="ph">
      <div class="ph-info">
        <div class="ph-eye">مدیریت</div>
        <div class="ph-title">مشتریان</div>
        <div class="ph-sub">${toFa(custs.length)} نفر</div>

        <button class="btn btn-dark" onclick="custForm()">+ مشتری جدید</button>

    <div class="cgrid">
      ${custs.length===0?`<div class="empty" style="grid-column:1/-1"><div class="empty-ico">👥</div><div class="empty-txt">مشتری پیدا نشد</div></div>`:
        custs.map(c=>{
          const cnt=allOrds.filter(o=>o.custId===c.id).length;
          return `
          <div class="cc" onclick="go('profile','${c.id}')">
            <div class="row g3 mb">
              <div class="av">${c.name[0]}</div>
              <div style="flex:1;min-width:0">
                <div class="black" style="font-size:14px">${c.name}</div>
                <div class="sm mut" style="margin-top:2px">${c.gender} · ${c.phone||'—'}</div>
              </div>

            <div class="row" style="padding-top:12px;border-top:1px solid var(--border)">
              <span class="sm mut">${toFa(cnt)} سفارش</span>

              </div>
            </div>

        }).join('')}
    </div>
  `);
}

async function custSave(id){
  const name=val('c-name');
  if(!name){toast('نام الزامی است','err');return;}
  const prev=id?await dbGet('customers',id):null;
  // collect custom measurements
  const customMeas={};
  document.querySelectorAll('#custom-meas-list .row, #custom-meas-list .cust-row').forEach(row=>{
    const k=row.querySelector('.cust-mkey')?.value?.trim();
    const v=row.querySelector('.cust-mval')?.value?.trim();
    if(k&&v) customMeas[k]=v;
  });
  const obj={
    id:id||'C-'+uid(), name,
    phone:val('c-phone'), addr:val('c-addr'),
    gender:val('c-gender'), note:val('c-note'),
    meas:{
      shirt:{neck:val('ms-neck'),chest:val('ms-chest'),shldr:val('ms-shldr'),slv:val('ms-slv'),len:val('ms-len'),wrist:val('ms-wrist')},
      pant:{waist:val('mp-waist'),hip:val('mp-hip'),thigh:val('mp-thigh'),knee:val('mp-knee'),len:val('mp-len')},
      custom:customMeas
    },
    ts:prev?.ts||Date.now()
  };
  await dbPut('customers',obj);
  closeModal();
  toast(id?'مشتری ویرایش شد ✅':'مشتری اضافه شد ✅');
  if(PAGE==='profile') pgProfile(id||CUST_ID); else pgCustomers();
}

async function custDel(id){
  if(!confirm('مشتری حذف شود؟')) return;
  await dbDel('customers',id);
  toast('مشتری حذف شد','err');
  pgCustomers();
}

async function pgProfile(id){
  const [c,allOrds,allSales]=await Promise.all([dbGet('customers',id),dbAll('orders'),dbAll('fabric-sales')]);
  if(!c){go('customers');return;}
  const cOrds=allOrds.filter(o=>o.custId===id).sort((a,b)=>b.ts-a.ts);
  const cSales=(allSales||[]).filter(s=>s.custId===id).sort((a,b)=>b.ts-a.ts);
  const ms=c.meas?.shirt||{}, mp=c.meas?.pant||{}, mc=c.meas?.custom||{};
  const mr=(l,v)=>v?`<div class="mrow"><span class="mkey">${l}</span><span class="mval">${toFa(v)} سانتی‌متر</span></div>`:'';

  // financial calculations
  const totalOrdAmount=cOrds.reduce((s,o)=>s+Number(o.price||0),0);
  const totalOrdPaid=cOrds.reduce((s,o)=>s+Number(o.paid||0),0);
  const totalSaleAmount=cSales.reduce((s,s2)=>s+Number(s2.price||0),0);
  const totalSalePaid=cSales.reduce((s,s2)=>s+Number(s2.paid||0),0);
  const totalDebt=(totalOrdAmount+totalSaleAmount)-(totalOrdPaid+totalSalePaid);
  const isDebt=totalDebt>0;

  // build transactions list: combine orders and fabric sales as transaction events
  const txns=[];
  cOrds.forEach(o=>{
    if(Number(o.paid||0)>0) txns.push({date:o.date||'',label:`سفارش ${o.type}`,type:'receipt',amount:Number(o.paid||0),id:o.id});
    const rem=Number(o.price||0)-Number(o.paid||0);
    if(rem>0) txns.push({date:o.delivery||o.date||'',label:`مانده ${o.type} — ${o.id}`,type:'debt',amount:rem,id:o.id});
  });
  cSales.forEach(s=>{
    if(Number(s.paid||0)>0) txns.push({date:s.date||'',label:`فروش تکه ${s.item||''}`,type:'receipt',amount:Number(s.paid||0),id:s.id});
    const rem=Number(s.price||0)-Number(s.paid||0);
    if(rem>0) txns.push({date:s.date||'',label:`مانده تکه ${s.item||''}`,type:'debt',amount:rem,id:s.id});
  });
  txns.sort((a,b)=>a.date<b.date?1:-1);

  setContent(`
    <div class="ph">
      <div class="ph-info">
        <div class="ph-eye">پروفایل مشتری</div>
        <div class="ph-title">${c.name}</div>
      </div>
      <div class="ph-actions">
        <button class="btn btn-ghost btn-sm" onclick="go('customers')">← برگشت</button>
        <button class="btn btn-ghost btn-sm" onclick="custForm('${id}')">✏️ ویرایش</button>
        <button class="btn btn-dark btn-sm" onclick="orderForm('','${id}')">+ سفارش جدید</button>
      </div>
    </div>

    <div class="pgrid">
      <div class="col g4">
        <div class="card" style="text-align:center;padding:28px">
          <div class="av av-lg" style="margin:0 auto 16px">${c.name[0]}</div>
          <div class="black" style="font-size:20px;margin-bottom:3px">${c.name}</div>
          <div class="sm mut mb">${c.gender}</div>
          <div class="col g3" style="text-align:right;font-size:13px">
            <div class="row g2"><span>📞</span><span>${c.phone||'—'}</span></div>
            <div class="row g2"><span>📍</span><span>${c.addr||'—'}</span></div>
          </div>
          ${c.note?`<div class="alert al-amber" style="margin-top:14px;font-size:12px">💬 ${c.note}</div>`:''}
        </div>

        <!-- Balance Card -->
        <div class="card" style="border-color:${isDebt?'var(--redbdr)':'var(--greenbdr)'};background:${isDebt?'var(--redbg)':'var(--greenbg)'}">
          <div class="st" style="color:${isDebt?'var(--red)':'var(--green)'}">💳 وضعیت حساب</div>
          <div style="text-align:center;padding:12px 0">
            <div style="font-size:36px;margin-bottom:8px">${isDebt?'🔴':'🟢'}</div>
            <div style="font-size:22px;font-weight:900;color:${isDebt?'var(--red)':'var(--green)'}">
              ${isDebt?`بدهکار: ${afs(totalDebt)}`:'✅ حساب تسویه'}
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center">
              <div class="sm mut">کل فاکتور</div>
              <div class="bold c-gold">${afs(totalOrdAmount+totalSaleAmount)}</div>
            </div>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center">
              <div class="sm mut">کل پرداخت</div>
              <div class="bold c-green">${afs(totalOrdPaid+totalSalePaid)}</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="st">✂️ اندازه پیراهن</div>
          <div class="mgrid">
            ${mr('دور گردن',ms.neck)}${mr('دور سینه',ms.chest)}
            ${mr('عرض شانه',ms.shldr)}${mr('طول آستین',ms.slv)}
            ${mr('طول پیراهن',ms.len)}${mr('دور مچ',ms.wrist)}
          </div>
          ${!Object.values(ms).some(Boolean)?`<div class="sm mut" style="text-align:center;padding:8px">ثبت نشده</div>`:''}
          <div class="st" style="margin-top:18px">👖 اندازه شلوار</div>
          <div class="mgrid">
            ${mr('دور کمر',mp.waist)}${mr('دور باسن',mp.hip)}
            ${mr('دور ران',mp.thigh)}${mr('دور زانو',mp.knee)}

          <div class="st" style="margin-top:18px">📐 اندازه‌های سفارشی</div>

            ${Object.entries(mc).map(([k,v])=>mr(k,v)).join('')}

      </div>

      <div class="col g4">

        <!-- Transactions -->
        <div class="card">
          <div class="st">💰 دریافت و پرداخت‌ها</div>
          ${txns.length===0?`<div class="empty"><div class="empty-ico">💰</div><div class="empty-txt">تراکنشی ندارد</div></div>`:`

              <span style="font-size:18px">${t.type==='receipt'?'💵':'⏳'}</span>
              <div style="flex:1;min-width:0">
                <div class="bold" style="font-size:12px">${t.label}</div>
                <div class="sm mut">${t.date||'—'}</div>
              </div>
              <div class="bold ${t.type==='receipt'?'c-green':'c-red'}" style="font-size:13px;white-space:nowrap">
                ${t.type==='receipt'?'+':'−'}${afs(t.amount)}
              </div>
            </div>`).join('')}
          </div>`}
        </div>

        <div class="card">
          <div class="st">📋 تاریخچه سفارش‌ها (${toFa(cOrds.length)})</div>

let orderFilter='همه', orderSearch='';
async function pgOrders(f){
  if(f!==undefined && typeof f==='string' && ['همه','در حال انجام','آماده تحویل','تحویل داده شده'].includes(f)) orderFilter=f;
  let ords=await dbAll('orders');
  ords.sort((a,b)=>b.ts-a.ts);
  const tot=ords.length;
  const inP=ords.filter(o=>o.status==='در حال انجام').length;
  const ready=ords.filter(o=>o.status==='آماده تحویل').length;

  // search
  if(orderSearch){
    const q=orderSearch.toLowerCase();
    ords=ords.filter(o=>
      o.custName?.toLowerCase().includes(q)||
      (o.date||'').includes(q)||
      (o.custPhone||'').includes(q)||
      (o.delivery||'').includes(q)
    );
  }
  const shown=orderFilter==='همه'?ords:ords.filter(o=>o.status===orderFilter);

  setContent(`
    <div class="ph">
      <div class="ph-info">
        <div class="ph-eye">مدیریت</div>
        <div class="ph-title">سفارش‌ها</div>

/* ── واتساپ helper ── */
function waLink(phone, msg){
  // normalize phone: strip leading 0, add country code if needed
  let p=(phone||'').replace(/\s|-/g,'');
  if(p.startsWith('0')) p='93'+p.slice(1); // Afghanistan default
  if(!p.startsWith('+') && !p.startsWith('9')) p='93'+p;
  p=p.replace(/^\+/,'');
  return `https://wa.me/${p}?text=${encodeURIComponent(msg)}`;
}

function openWaModal(title, custName, custPhone, msg, onConfirm){
  const phone=custPhone||'';
  const hasPhone=phone.trim().length>0;
  openModal(`
    <div class="mhead">
      <span class="mtitle">${title}</span>
      <button class="btn btn-ghost btn-ico btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="alert al-green mb" style="align-items:center;gap:12px">
        <span style="font-size:22px">✅</span>
        <div>عملیات انجام شد — حالا به مشتری اطلاع بده</div>
      </div>
      <div class="st" style="margin-bottom:10px">📱 پیام برای ${custName} ${phone?`(${phone})`:''}</div>
      <div id="wa-msg-box" class="sms-preview" contenteditable="true" style="min-height:80px;outline:none;cursor:text">${msg}</div>
      <div class="sm mut" style="margin-top:6px">✏️ می‌تونی متن رو ویرایش کنی قبل از ارسال</div>
    </div>
    <div class="mfoot" style="flex-wrap:wrap;gap:8px">
      ${hasPhone?`<a id="wa-btn" href="${waLink(phone,msg)}" target="_blank" class="btn btn-green" style="text-decoration:none" onclick="setTimeout(closeModal,400)">
        <span style="font-size:16px">💬</span> ارسال در واتساپ
      </a>`:`<div class="alert al-amber" style="margin:0;font-size:12px">⚠️ شماره تلفن مشتری ثبت نشده</div>`}
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">بعداً</button>
    </div>
  `);
  // keep link updated as user edits the message
  const box=document.getElementById('wa-msg-box');
  const btn=document.getElementById('wa-btn');
  if(box&&btn){
    box.addEventListener('input',()=>{
      btn.href=waLink(phone, box.innerText);
    });
  }
}

async function markReady(id){
  const o=await dbGet('orders',id);
  if(!o) return;
  o.status='آماده تحویل';
  await dbPut('orders',o);
  const cust=await dbGet('customers',o.custId);
  const cfg=await dbGet('cfg','sms')||{};
  const shopCfg=await dbGet('cfg','shop')||{};
  const shopName=shopCfg.name||'Neo Soft';
  const tpl=(cfg?.waReadyTemplate)||'سلام {نام} عزیز 👋\nلباس شما ({نوع}) آماده تحویل می‌باشد.\nمنتظر شما هستیم 🎉\n— {مغازه}';
  const msg=tpl
    .replace(/{نام}/g, cust?.name||'مشتری')
    .replace(/{سفارش}/g, id)
    .replace(/{نوع}/g, o.type||'لباس')
    .replace(/{مغازه}/g, shopName);
  openWaModal('🔔 سفارش آماده تحویل', cust?.name||'', cust?.phone||'', msg);
  if(PAGE==='profile') pgProfile(CUST_ID); else pgOrders();
  refreshBadge();
}

      <button class="btn btn-ghost btn-ico btn-sm" onclick="closeModal()">✕</button>
    </div>

      <div class="fg fg2">
        <div class="fld"><label>مشتری *</label><select id="o-cust">${custOpts}</select></div>
        <div class="fld"><label>نوع لباس *</label>

        <div class="fld fspan">
          <label>📦 انتخاب پارچه از انبار (اختیاری — موجودی کسر می‌شود)</label>
          <select id="o-inv-sel">${invOpts}</select>
          <div id="o-inv-info" style="display:none;margin-top:6px">
            <div class="alert al-blue" id="o-inv-box" style="font-size:12px;margin-bottom:0"></div>
          </div>
        </div>
        <div class="fld"><label>متراژ مصرف‌شده از انبار</label><input type="number" id="o-inv-qty" value="${o?.invQty||''}" placeholder="اختیاری — مثال: ۳.۵" step="0.5" min="0"></div>
        <div class="fld"><label>تاریخ سفارش</label>${makeDateInput('o-date', o?.date||today())}</div>
        <div class="fld"><label>تاریخ تحویل</label>${makeDateInput('o-delivery', o?.delivery||'')}</div>
        <div class="fld"><label>مبلغ کل (افغانی) *</label><input type="number" id="o-price" value="${o?.price||''}"></div>
        <div class="fld"><label>پرداختی (افغانی)</label><input type="number" id="o-paid" value="${o?.paid||''}"></div>
        <div class="fld"><label>وضعیت</label>
          <select id="o-status">
            <option ${(o?.status||'در حال انجام')==='در حال انجام'?'selected':''}>در حال انجام</option>
            <option ${o?.status==='آماده تحویل'?'selected':''}>آماده تحویل</option>
            <option ${o?.status==='تحویل داده شده'?'selected':''}>تحویل داده شده</option>
          </select>
        </div>
        <div class="fld fspan"><label>یادداشت</label><textarea id="o-note" rows="2">${o?.note||''}</textarea></div>
      </div>

  const oInvInfo=el('o-inv-info');

  if(oInvSel){

async function orderSave(id){
  const custId=val('o-cust'), price=val('o-price');
  if(!custId||!price){toast('مشتری و مبلغ الزامی است','err');return;}
  const cust=await dbGet('customers',custId);
  const prev=id?await dbGet('orders',id):null;
  const ordId=id||'ORD-'+uid();
  const invSel=el('o-inv-sel');
  const invId=invSel?.value||'';
  const invQty=val('o-inv-qty');
  await dbPut('orders',{
    id:ordId,
    custId, custName:cust?.name||'', custPhone:cust?.phone||'',
    type:val('o-type'), qty:val('o-qty'),
    fabric:val('o-fabric'), date:val('o-date'),
    delivery:val('o-delivery'), price,
    paid:val('o-paid'), status:val('o-status'),
    invId:invId||'', invQty:invQty||'',
    note:val('o-note'), ts:prev?.ts||Date.now()
  });

  // ── Auto-deduct inventory (only for new orders) ──
  if(!id && invId && invQty && Number(invQty)>0){
    const invItem=await dbGet('inventory',invId);
    if(invItem){
      const newQty=Math.max(0,Number(invItem.qty||0)-Number(invQty));
      invItem.qty=String(newQty);
      await dbPut('inventory',invItem);
    }
  }
  closeModal();
  if(!id){
    // New order — show print confirmation
    openModal(`
      <div class="mhead">
        <span class="mtitle">✅ سفارش ثبت شد</span>
        <button class="btn btn-ghost btn-ico btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div class="mbody" style="text-align:center;padding:30px 24px">
        <div style="font-size:48px;margin-bottom:14px">🧾</div>
        <div class="black" style="font-size:18px;margin-bottom:6px">سفارش ${ordId} ثبت شد</div>
        <div class="sm mut mb">آیا می‌خواهید رسید سفارش را چاپ کنید؟</div>
      </div>
      <div class="mfoot" style="justify-content:center;gap:12px">
        <button class="btn btn-dark" onclick="closeModal();printOrder('${ordId}')">🖨️ چاپ رسید</button>
        <button class="btn btn-ghost" onclick="closeModal()">بعداً</button>
      </div>
    `);
  } else {
    toast('سفارش ویرایش شد ✅');
  }
  if(PAGE==='profile') pgProfile(CUST_ID); else pgOrders();
}

async function quickPay(id){
  const o=await dbGet('orders',id);
  if(!o) return;
  const rem=Number(o.price||0)-Number(o.paid||0);
  if(rem<=0){toast('این سفارش پرداخت شده است ✅');return;}
  openModal(`
    <div class="mhead">
      <span class="mtitle">💵 دریافت پرداخت</span>
      <button class="btn btn-ghost btn-ico btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="alert al-amber mb">سفارش <strong>${o.id}</strong> — مانده: <strong class="c-red">${afs(rem)}</strong></div>
      <div class="fg">
        <div class="fld"><label>مبلغ دریافتی (افغانی) *</label>
          <input type="number" id="qp-amount" value="${rem}" placeholder="${rem}">
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gold" id="btn-qp-save">✅ ثبت پرداخت</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">انصراف</button>
    </div>
  `);
  el('btn-qp-save').addEventListener('click',async()=>{
    const amt=Number(el('qp-amount')?.value||0);
    if(!amt||amt<=0){toast('مبلغ را وارد کنید','err');return;}
    const newPaid=Math.min(Number(o.price||0), Number(o.paid||0)+amt);
    o.paid=String(newPaid);
    await dbPut('orders',o);
    closeModal();
    toast(`${afs(amt)} دریافت شد ✅`);
    if(PAGE==='profile') pgProfile(CUST_ID);
    else if(PAGE==='debtors') pgDebtors();
    else pgOrders();
    refreshBadge();
  });
}

const EXP_CATS=['اجاره مغازه','برق و آب','حقوق کارمند','خرید پارچه','خرید لوازم','تعمیرات','تبلیغات','حمل و نقل','غذا و پذیرایی','سایر'];
const FIXED_CATS=['اجاره مغازه','برق و آب','حقوق کارمند','غذا و پذیرایی'];
let expCatFilter='همه', expTimeFilter='همه', expSearch='', expDateFrom='', expDateTo='';

function filterExpByTime(exps, tf){
  if(tf==='همه') return exps;
  const t=today().split('/');
  const jy=parseInt(t[0]), jm=parseInt(t[1]), jd=parseInt(t[2]);
  const pad=n=>String(n).padStart(2,'0');
  let startStr,endStr;
  if(tf==='هفتگی'){
    // go back 6 days
    let d2=Jalali._j2g(jy,jm,jd);
    d2.setDate(d2.getDate()-6);
    const [sy,sm,sd]=Jalali._convert(d2.getFullYear(),d2.getMonth()+1,d2.getDate());
    startStr=`${sy}/${pad(sm)}/${pad(sd)}`;
    endStr=today();
  } else if(tf==='ماهانه'){
    startStr=`${jy}/${pad(jm)}/01`;
    endStr=today();
  } else if(tf==='سالانه'){
    startStr=`${jy}/01/01`;
    endStr=today();
  }
  return exps.filter(e=>{
    const d=ensureJalali(e.date)||'';
    return d>=startStr && d<=endStr;
  });
}

async function pgExpenses(catF,timeF,searchF){

  let shown=filterExpByTime(allExps, expTimeFilter);
  // custom date range overrides time filter
  if(expDateFrom||expDateTo){
    shown=allExps.filter(e=>{
      const d=ensureJalali(e.date)||'';
      if(expDateFrom && d<expDateFrom) return false;

  if(expCatFilter==='ثابت') shown=(expDateFrom||expDateTo?shown:filterExpByTime(allExps,expTimeFilter)).filter(e=>FIXED_CATS.includes(e.cat));

async function pgDebtors(){
  const [ords,custs,fSales]=await Promise.all([dbAll('orders'),dbAll('customers'),dbAll('fabric-sales')]);
  // group debts by customer
  const debtMap={};
  ords.forEach(o=>{
    const rem=Number(o.price||0)-Number(o.paid||0);
    if(rem>0){
      if(!debtMap[o.custId]) debtMap[o.custId]={custId:o.custId,custName:o.custName,phone:o.custPhone||'',orders:[],fabrics:[],total:0};
      debtMap[o.custId].orders.push({id:o.id,type:o.type,rem});
      debtMap[o.custId].total+=rem;
    }
  });
  (fSales||[]).forEach(s=>{
    const rem=Number(s.price||0)-Number(s.paid||0);
    if(rem>0){
      const cust=custs.find(c=>c.id===s.custId)||{};

async function quickPay(custId, custName, totalDebt){
  openModal(`
    <div class="mhead">
      <span class="mtitle">💵 دریافت پرداخت</span>
      <button class="btn btn-ghost btn-ico btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="mbody">
      <div class="alert al-red" style="margin-bottom:16px">
        بدهی کل <strong>${custName}</strong>: <strong>${afs(totalDebt)}</strong>
      </div>
      <div class="fg fg2">
        <div class="fld fspan"><label>مبلغ دریافتی (افغانی) *</label>
          <input type="number" id="qp-amount" value="${totalDebt}" placeholder="مبلغ دریافتی">
        </div>
        <div class="fld fspan"><label>توضیح (اختیاری)</label>
          <input id="qp-note" placeholder="مثال: بخشی از بدهی قبلی">
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gold" id="btn-qp-save">✅ ثبت پرداخت</button>
      <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
    </div>
  `);
  el('btn-qp-save').addEventListener('click', async()=>{
    const amount=Number(val('qp-amount'));
    const note=val('qp-note');
    if(!amount||amount<=0){toast('مبلغ الزامی است','err');return;}
    // distribute payment across unpaid orders oldest first
    const ords=(await dbAll('orders'))
      .filter(o=>o.custId===custId && Number(o.price||0)-Number(o.paid||0)>0)
      .sort((a,b)=>a.ts-b.ts);
    let remaining=amount;
    for(const o of ords){
      if(remaining<=0) break;
      const rem=Number(o.price||0)-Number(o.paid||0);
      const pay=Math.min(rem,remaining);
      o.paid=String(Number(o.paid||0)+pay);
      await dbPut('orders',o);
      remaining-=pay;
    }
    // also distribute on fabric-sales
    if(remaining>0){
      const fSales=(await dbAll('fabric-sales'))
        .filter(s=>s.custId===custId && Number(s.price||0)-Number(s.paid||0)>0)
        .sort((a,b)=>a.ts-b.ts);
      for(const s of fSales){
        if(remaining<=0) break;
        const rem=Number(s.price||0)-Number(s.paid||0);
        const pay=Math.min(rem,remaining);
        s.paid=String(Number(s.paid||0)+pay);
        await dbPut('fabric-sales',s);
        remaining-=pay;
      }
    }
    closeModal();
    toast(`${afs(amount)} از ${custName} دریافت شد ✅`);
    pgDebtors();
  });
}

async function invEndStock(id, name){
  const item=await dbGet('inventory',id);
  if(!item) return;
  const remainQty=Number(item.qty||0);
  const costPerUnit=Number(item.cost||0);
  const totalCost=remainQty*costPerUnit;

  let msg=`موجودی "${name}" صفر شود؟`;
  if(totalCost>0){
    msg+=`\n\nموجودی فعلی: ${remainQty} ${item.unit||'عدد'}\nقیمت خرید هر واحد: ${costPerUnit.toLocaleString()} افغانی\nجمع هزینه: ${totalCost.toLocaleString()} افغانی\n\nاین مبلغ اتوماتیک به مخارج اضافه می‌شود.`;
  }
  if(!confirm(msg)) return;

  // Add to expenses if cost is set and qty > 0
  if(totalCost>0 && remainQty>0){
    await dbPut('expenses',{
      id:'EXP-INV-'+id+'-'+Date.now(),
      title:`بهای تمام‌شده: ${name}${item.code?' (#'+item.code+')':''}`,
      cat:'خرید پارچه',
      amount:String(totalCost),
      date:today(),
      note:`اتمام موجودی — ${toFa(remainQty)} ${item.unit||'عدد'} × ${afs(costPerUnit)}`,
      ts:Date.now()
    });
  }

  item.qty='0';
  await dbPut('inventory',item);

  if(totalCost>0){
    toast(`موجودی صفر شد · ${afs(totalCost)} به مخارج اضافه شد 📭`);
  } else {
    toast(`موجودی ${name} صفر شد 📭`,'err');
  }
  pgInventory();
  refreshBadge();
}

async function invDel(id){
  if(!confirm('کالا حذف شود؟')) return;
  await dbDel('inventory',id);
  toast('کالا حذف شد','err');

}

      </div>

      <button class="btn btn-dark" onclick="fabricSaleSave('${id||''}')">💾 ذخیره و ثبت هزینه</button>
      <button class="btn btn-ghost" onclick="closeModal()">انصراف</button>
    </div>
  `);

  // Wire up item selection logic
  const sel=el('fs-item-sel');
  const txt=el('fs-item-txt');
  const costInfo=el('fs-cost-info');
  const costBox=el('fs-cost-box');
  const qtyInput=el('fs-qty');
  const priceInput=el('fs-price');

  function updateCostInfo(){
    const opt=sel.options[sel.selectedIndex];
    const isCustom=sel.value==='__custom__'||sel.value==='';
    txt.style.display=isCustom?'block':'none';
    if(!isCustom && sel.value){
      const cost=Number(opt.dataset.cost||0);
      const sell=Number(opt.dataset.sell||0);
      const avail=opt.dataset.qty;
      const unit=opt.dataset.unit||'متر';
      const code=opt.dataset.code;
      costInfo.style.display='block';
      costBox.innerHTML=`📦 موجودی: <strong>${toFa(avail)} ${unit}</strong>${cost?` · قیمت خرید هر ${unit}: <strong style="color:var(--red)">${afs(cost)}</strong>`:''}${sell?` · قیمت پیشنهادی فروش هر ${unit}: <strong style="color:var(--green)">${afs(sell)}</strong>`:''}`;
      // auto-fill sell price × qty if sell price set
      if(sell && qtyInput.value && !priceInput.value){
        priceInput.value=Number(sell)*Number(qtyInput.value);
      }
    } else {
      costInfo.style.display='none';
    }
  }

  sel.addEventListener('change', updateCostInfo);
  qtyInput.addEventListener('input',()=>{
    const opt=sel.options[sel.selectedIndex];
    if(sel.value && sel.value!=='__custom__'){
      const sell=Number(opt.dataset.sell||0);
      if(sell) priceInput.value=sell*Number(qtyInput.value||0);
    }
  });

  // Trigger on load if editing
  if(s?.invId) updateCostInfo();
}

async function fabricSaleSave(id){
  const price=val('fs-price');
  if(!price){toast('مبلغ الزامی است','err');return;}

  const sel=el('fs-item-sel');
  const isCustom=!sel||sel.value===''||sel.value==='__custom__';
  const opt=sel?sel.options[sel.selectedIndex]:null;

  // get item name
  let item='', invId='', costPerUnit=0, invUnit='متر';
  if(!isCustom && sel.value){
    invId=sel.value;
    item=opt?.dataset?.name||'';
    costPerUnit=Number(opt?.dataset?.cost||0);
    invUnit=opt?.dataset?.unit||'متر';
    // also grab code
  } else {
    item=el('fs-item-txt')?.value?.trim()||'';
  }
  if(!item){toast('نام تکه الزامی است','err');return;}

  const qty=val('fs-qty');
  if(!qty||Number(qty)<=0){toast('متراژ را وارد کنید','err');return;}

  const custId=val('fs-cust');
  const cust=custId?await dbGet('customers',custId):null;
  const prev=id?await dbGet('fabric-sales',id):null;
  const saleId=id||'FS-'+uid();
  const saleDate=val('fs-date')||today();

  const invCode=(!isCustom&&opt?.dataset?.code)||'';

  // Save the sale
  await dbPut('fabric-sales',{
    id:saleId,
    item, invId, invCode, custId:custId||'', custName:cust?.name||'',
    qty, price, paid:val('fs-paid'),
    date:saleDate, note:val('fs-note'),
    ts:prev?.ts||Date.now()
  });

  // ── Auto-deduct from inventory ──
  if(invId){
    const invItem=await dbGet('inventory',invId);
    if(invItem){
      const newQty=Math.max(0,Number(invItem.qty||0)-Number(qty));
      invItem.qty=String(newQty);
      await dbPut('inventory',invItem);
    }
  }

  // ── Auto-add cost to expenses ──
  if(!id && costPerUnit>0 && Number(qty)>0){
    const expAmount=costPerUnit*Number(qty);
    await dbPut('expenses',{
      id:'EXP-FS-'+saleId,
      title:`بهای تمام‌شده تکه: ${item} (${toFa(qty)} ${invUnit})`,
      cat:'خرید پارچه',
      amount:String(expAmount),
      date:saleDate,
      note:`اتوماتیک از فروش ${saleId}`,
      ts:Date.now()
    });
    toast(`فروش ثبت شد ✅  |  هزینه ${afs(expAmount)} به مخارج اضافه شد`);
  } else {
    toast(id?'فروش ویرایش شد ✅':'فروش ثبت شد ✅');
  }

  closeModal();
  pgFabricSales();
  refreshBadge();
}

async function fabricSaleDel(id){
  if(!confirm('این فروش حذف شود؟')) return;
  await dbDel('fabric-sales',id);
  toast('حذف شد','err');
  pgFabricSales();
}

  `);

  // Tab visibility
  function applyTabFilter(){
    const os=el('rpt-orders-section'), es=el('rpt-expenses-section'), ps=el('rpt-profit-section');
    if(reportType==='all'){os.style.display='';es.style.display='';ps.style.display='';}
    else if(reportType==='orders'){os.style.display='';es.style.display='none';ps.style.display='none';}
    else if(reportType==='expenses'){os.style.display='none';es.style.display='';ps.style.display='none';}
    else if(reportType==='profit'){os.style.display='none';es.style.display='none';ps.style.display='';}
    ['all','orders','expenses','profit'].forEach(t=>{
      const b=el('rpt-tab-'+t);
      if(b) b.classList.toggle('on',reportType===t);
    });
  }
  applyTabFilter();

  ['all','orders','expenses','profit'].forEach(t=>{
    const b=el('rpt-tab-'+t);
    if(b) b.addEventListener('click',()=>{reportType=t;applyTabFilter();});
  });

  // ── فیلتر تاریخ — apply/clear ──
  el('btn-rpt-apply')?.addEventListener('click',()=>{
    reportDateFrom=el('rpt-from')?.value?.trim()||'';
    reportDateTo=el('rpt-to')?.value?.trim()||'';
    pgReports();
  });
  el('btn-rpt-clear')?.addEventListener('click',()=>{
    reportDateFrom=''; reportDateTo=''; reportSearch=''; pgReports();
  });

  // ── سرچ بدون re-render ──
  const rsi=el('rpt-search-inp');
  if(rsi){
    rsi.focus();
    rsi.setSelectionRange(rsi.value.length, rsi.value.length);
    rsi.addEventListener('input',e=>{
      reportSearch=e.target.value.trim().toLowerCase();
      const tbody=el('rpt-tbody');
      if(!tbody) return;
      tbody.querySelectorAll('tr[data-q]').forEach(row=>{
        const match=!reportSearch || row.dataset.q.includes(reportSearch);
        row.style.display=match?'':'none';
      });
    });
  }

  el('btn-print-report')?.addEventListener('click',printReport);
}

async function exportData(){
  const [custs,ords,inv,exps,fSales]=await Promise.all([dbAll('customers'),dbAll('orders'),dbAll('inventory'),dbAll('expenses'),dbAll('fabric-sales')]);
  const data={customers:custs,orders:ords,inventory:inv,expenses:exps,'fabric-sales':fSales,exportedAt:new Date().toISOString()};
  const json = JSON.stringify(data,null,2);
  
  try {
    const date = new Date().toISOString().slice(0,10);
    const fname = `atelye-backup-${date}.json`;
    const blob = new Blob([json], {type:'application/json'});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[new File([blob], fname, {type:'application/json'})]})){
      await navigator.share({files:[new File([blob], fname, {type:'application/json'})], title:fname});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname;
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    }
    toast('پشتیبان ذخیره شد ✅ ' + fname);
  } catch(err) {
    console.error(err);
    toast('خطا در ذخیره پشتیبان', 'err');
  }
}

/* ══════════════════════════════════════════════
   LICENSE  — device-bound signed token (HMAC-SHA256)
   Mirrors the USB-v3 scheme but ties to a browser
   install-id stored in localStorage instead of a
   USB hardware serial.
══════════════════════════════════════════════ */
const License = (function(){
  const MASTER_SECRET = 'atelye@khayat#2024$secret!key|v2';
  const PRODUCT = 'atelye';
  const VERSION = 'pwa-1';
  const LS_TOKEN  = 'atelye_license_token';
  const LS_DEV_ID = 'atelye_device_id';
  const CHECK_INTERVAL = 8000;
  let _label = '';

  function deviceId(){
    let id = localStorage.getItem(LS_DEV_ID);
    if(!id){
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      id = Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(LS_DEV_ID, id);
    }
    return id;
  }

  async function hmacHex(msg){
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(MASTER_SECRET),
      {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', key, enc.encode(msg));
    return Array.from(new Uint8Array(sig)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function b64decode(s){
    try {
      const bin = atob(s);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    } catch(e){ return null; }
  }

  async function verifyToken(token){
    if(!token) return null;
    const raw = b64decode(token.trim());
    if(!raw) return null;
    let p; try { p = JSON.parse(raw); } catch(e){ return null; }
    if(p.product !== PRODUCT) return null;
    if(p.version !== VERSION) return null;
    if(p.device_id !== deviceId()) return null;
    const expected = await hmacHex(`${p.label}:${p.device_id}`);
    if(expected !== p.sig) return null;
    return p.label;
  }

  async function verify(){
    const token = localStorage.getItem(LS_TOKEN);
    const label = await verifyToken(token);
    if(label){ _label = label; return true; }
    return false;
  }

  function showGate(){
    const did = deviceId();
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#1c1409;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl">
        <div style="max-width:460px;width:100%;background:#2a1f0f;border:1.5px solid rgba(240,184,64,.25);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)">
          <div style="text-align:center;font-size:56px;margin-bottom:16px">🔑</div>
          <h1 style="color:#f0b840;font-size:20px;text-align:center;margin:0 0 8px;font-weight:900">فعال‌سازی نرم‌افزار</h1>
          <p style="color:rgba(255,255,255,.5);font-size:13px;text-align:center;line-height:1.8;margin-bottom:22px">برای فعال کردن این دستگاه، کد دستگاه زیر را به سازنده ارسال کنید و توکن دریافتی را وارد نمایید.</p>
          <label style="display:block;color:rgba(255,255,255,.6);font-size:12px;margin-bottom:6px">کد این دستگاه:</label>
          <div id="lg-did" style="background:#1c1409;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;color:#f0b840;font-family:monospace;font-size:12px;word-break:break-all;margin-bottom:8px">${did}</div>
          <button id="lg-copy" style="width:100%;background:rgba(240,184,64,.15);color:#f0b840;border:1px solid rgba(240,184,64,.3);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;cursor:pointer;margin-bottom:20px">کپی کد دستگاه</button>
          <label style="display:block;color:rgba(255,255,255,.6);font-size:12px;margin-bottom:6px">توکن مجوز:</label>
          <textarea id="lg-tok" placeholder="توکن دریافتی را اینجا وارد کنید" style="width:100%;min-height:90px;background:#1c1409;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;color:#fff;font-family:monospace;font-size:12px;resize:vertical;box-sizing:border-box;direction:ltr;text-align:left"></textarea>
          <div id="lg-err" style="color:#f87171;font-size:12px;min-height:18px;margin:8px 0;text-align:center"></div>
          <button id="lg-ok" style="width:100%;background:linear-gradient(180deg,#d4921f,#b8791a);color:#fff;border:0;border-radius:12px;padding:14px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer">فعال‌سازی</button>
        </div>
      </div>`;
    document.getElementById('lg-copy').onclick = async () => {
      try { await navigator.clipboard.writeText(did); document.getElementById('lg-copy').textContent = 'کپی شد ✓'; }
      catch(e){ document.getElementById('lg-err').textContent = 'کپی نشد — دستی انتخاب کنید'; }
    };
    document.getElementById('lg-ok').onclick = async () => {
      const tok = document.getElementById('lg-tok').value.trim();
      const err = document.getElementById('lg-err');
      err.textContent = 'در حال بررسی…';
      const label = await verifyToken(tok);
      if(label){
        localStorage.setItem(LS_TOKEN, tok);
        location.reload();
      } else {
        err.textContent = 'توکن نامعتبر یا مربوط به دستگاه دیگر است';
      }
    };
  }

  let _locked = false;
  function lockOverlay(){
    if(_locked) return;
    _locked = true;
    const o = document.createElement('div');
    o.id = '_usb_lock';
    o.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1c1409;display:flex;align-items:center;justify-content:center;font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl';
    o.innerHTML = '<div style="text-align:center;padding:48px;background:#2a1f0f;border:1.5px solid rgba(255,100,100,.3);border-radius:24px;max-width:400px"><div style="font-size:72px;margin-bottom:20px">🔒</div><h2 style="color:#f87171;margin-bottom:14px;font-size:20px">مجوز نامعتبر</h2><p style="color:rgba(255,255,255,.4);font-size:13px;line-height:2">License invalid or tampered.<br>برنامه را دوباره باز کنید.</p></div>';
    document.body.appendChild(o);
  }

  function startWatchdog(){
    setInterval(async () => {
      const ok = await verify();
      if(!ok) lockOverlay();
    }, CHECK_INTERVAL);
  }

  return { verify, showGate, startWatchdog, deviceId, get label(){ return _label; } };
})();

async function init(){
  try{
    await openDB();
    const ok = await License.verify();
    if(!ok){ License.showGate(); return; }
    await seedIfEmpty();
    await go('dashboard');
    License.startWatchdog();
    registerSW();
  }catch(err){
    console.error('init error:',err);
    el('content').innerHTML=`<div class="alert al-red">❌ خطا در راه‌اندازی: ${err.message}</div>`;
  }
}

function registerSW(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW failed:',e));
  }
}

init();
